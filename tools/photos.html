      <!--
        Newest first. The three blanks below only show the layout; replace them.
        A real plate looks like this:

        <figure class="plate" id="plate-01">
          <a href="/photos/01-2400.jpg">
            <img
              src="/photos/01-1600.jpg"
              srcset="/photos/01-800.jpg 800w, /photos/01-1600.jpg 1600w, /photos/01-2400.jpg 2400w"
              sizes="(max-width: 60rem) 100vw, 54rem"
              width="2400" height="1600"
              alt="What is in the picture, for someone who cannot see it."
              loading="lazy"
            />
          </a>
          <figcaption>
            <span>Plate 01 — Where it is, year.</span>
            <span class="readout">35 mm · f/2 · 1/250 s</span>
          </figcaption>
        </figure>
      -->
      <div class="plates">
        <figure class="plate" id="plate-03">
          <div class="blank" style="--w: 3; --h: 2"></div>
          <figcaption>
            <span>Plate 03 — Awaiting a photograph.</span>
            <span class="readout">3 : 2</span>
          </figcaption>
        </figure>
        <figure class="plate" id="plate-02">

        <figure class="plate" id="plate-01">
